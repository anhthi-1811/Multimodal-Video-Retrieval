version: '3.8'

services:
  # --- SERVICE 1: BACKEND API (FASTAPI + AGENT) ---
  api_backend:
    build: ./api  # Updated to match the "api" directory
    ports:
      - "8000:8000"
    volumes:
      # Map the local data directory into the container
      # Allows the backend to access FAISS indices and vector DBs
      - ./data:/app/data
    env_file:
      # Automatically load all variables from .env file (GOOGLE_API_KEY, MONGO_URI)
      - .env
    restart: unless-stopped 

  # --- SERVICE 2: FRONTEND WEB UI (STREAMLIT) ---
  web_frontend:
    build: ./ui   # Updated to match the "ui" directory
    ports:
      - "8501:8501"
    volumes:
      # CRITICAL FIX: Map the data directory so Streamlit can read and render the physical images
      - ./data:/app/data
    environment:
      # Tell the frontend where the backend API is located
      - API_URL=http://api_backend:8000/api/search
    depends_on:
      - api_backend
    restart: unless-stopped 